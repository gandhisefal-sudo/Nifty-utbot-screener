<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nifty 50 Intraday UT Bot Screener</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 820px; margin: 30px auto; padding: 0 16px; background: #0f172a; color: #f8fafc; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: #1e293b; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    select, input, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 14px; }
    button { background: #10b981; color: #064e3b; font-weight: 700; border: none; cursor: pointer; }
    button:hover { background: #34d399; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #94a3b8; font-size: 13px; text-transform: uppercase; }
    .badge { background: #065f46; color: #6ee7b7; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; }
    .meta { color: #94a3b8; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h2>Nifty 50 Intraday UT Bot Buy Screener</h2>

  <div class="controls">
    <label>Timeframe:
      <select id="interval">
        <option value="5m" selected>5 Min</option>
        <option value="15m">15 Min</option>
        <option value="1h">1 Hour</option>
      </select>
    </label>
    <label>Key Value: <input type="number" id="keyValue" value="1" step="0.5" min="0.5" style="width:60px;" /></label>
    <label>ATR Period: <input type="number" id="atrPeriod" value="10" min="1" style="width:60px;" /></label>
    <button onclick="runScan()">Scan Now</button>
    <label style="margin-left:auto; cursor:pointer;">
      <input type="checkbox" id="autoScan" onchange="toggleAutoScan()" /> Auto-Scan (60s)
    </label>
  </div>

  <div class="meta" id="status">Click "Scan Now" to scan all 50 Nifty stocks.</div>

  <table>
    <thead>
      <tr>
        <th>Stock (NSE)</th>
        <th>Signal</th>
        <th>Last Price (₹)</th>
        <th>UT Stop Loss (₹)</th>
        <th>Candle Time (IST)</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>

  <script>
    let timer = null;
    let previousSymbols = new Set();

    function playBeep() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }

    async function runScan() {
      const interval = document.getElementById("interval").value;
      const keyValue = document.getElementById("keyValue").value;
      const atrPeriod = document.getElementById("atrPeriod").value;
      const statusEl = document.getElementById("status");
      statusEl.textContent = `Scanning ${interval} intraday candles across Nifty 50...`;

      try {
        const res = await fetch(`/.netlify/functions/scan?interval=${interval}&keyValue=${keyValue}&atrPeriod=${atrPeriod}`);
        const data = await res.json();
        const istNow = new Date(data.updatedAt).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata" });
        statusEl.textContent = `Scanned ${data.scannedCount} stocks (${data.interval}) at ${istNow} IST — Found ${data.buySignals.length} buy signal(s).`;

        const tbody = document.getElementById("results");
        if (!data.buySignals.length) {
          tbody.innerHTML = `<tr><td colspan="5" style="color:#94a3b8;">No fresh UT Bot buy signals on the ${interval} timeframe right now.</td></tr>`;
          return;
        }

        let hasNewAlert = false;
        tbody.innerHTML = data.buySignals.map(s => {
          if (!previousSymbols.has(s.symbol)) hasNewAlert = true;
          const candleIST = new Date(s.candleTime * 1000).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit" });
          return `<tr>
            <td><strong>${s.symbol}</strong></td>
            <td><span class="badge">${s.status}</span></td>
            <td>₹${s.close}</td>
            <td>₹${s.trailingStop}</td>
            <td>${candleIST}</td>
          </tr>`;
        }).join("");

        if (hasNewAlert && previousSymbols.size > 0) playBeep();
        previousSymbols = new Set(data.buySignals.map(s => s.symbol));
      } catch (err) {
        statusEl.textContent = "Error scanning stocks. Check Netlify function logs.";
      }
    }

    function toggleAutoScan() {
      if (document.getElementById("autoScan").checked) {
        runScan();
        timer = setInterval(runScan, 60000);
      } else {
        clearInterval(timer);
      }
    }
  </script>
</body>
</html>
